<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Events | Git Practice</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <p class="eyebrow">CAMPUS CODE CLUB</p>
    <section class="event-card" aria-labelledby="event-title">
      <div class="event-icon" aria-hidden="true">{ }</div>
      <p class="event-label">UP NEXT</p>
      <h1 id="event-title">Loading event...</h1>
      <p class="event-details">Friday · 4:00 PM · Computing Lab</p>
      <button id="join-button" type="button">Join event</button>
      <p id="join-message" aria-live="polite">Bring your laptop and curiosity.</p>
    </section>
    <p class="footer-note">A tiny app for practising Git with real code.</p>
  </main>
</body>
</html>
